<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBUY</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- Blazor lo muestra asignando style.display; por eso es el unico estilo en linea permitido. -->
    <div id="blazor-error-ui" class="alert alert-warning position-fixed bottom-0 start-0 end-0 m-0 rounded-0" style="display:none" role="alert">
        <button type="button" class="dismiss btn-close float-end" aria-label="Cerrar"></button>
        Se produjo un error inesperado.
        <a href="." class="reload alert-link">Recargar</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
