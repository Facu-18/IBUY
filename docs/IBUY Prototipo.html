  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

3eb}a:hover{color:#1d4ed8}\ninput:focus{outline:2px solid #93c5fd;outline-offset:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column\">\n  <header style=\"height:80px;flex:none;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 32px;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"width:52px;height:52px;border-radius:12px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px\">iB<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1.1\">IBUY<\u002Fspan>\n        <span style=\"font-size:15px;color:#475569\">Plataforma de compras y stock<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:28px\">\n      <div style=\"display:flex;gap:4px;padding:5px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0\">\n        <button sc-camel-on-click=\"{{ setComprador }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:600;font-size:18px;padding:8px 20px;border-radius:999px;background:{{ compradorBg }};color:{{ compradorColor }};box-shadow:{{ compradorShadow }}\">Comprador<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setProveedor }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:600;font-size:18px;padding:8px 20px;border-radius:999px;background:{{ proveedorBg }};color:{{ proveedorColor }};box-shadow:{{ proveedorShadow }}\">Proveedor<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end\">\n          <span style=\"font-weight:700;font-size:17px\">Constructora del Sur SA<\u002Fspan>\n          <span style=\"font-size:15px;color:#475569\">Sergio Algorry · Administrador<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px\">SA<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"flex:1;display:flex;min-height:0\">\n    <nav style=\"width:330px;flex:none;background:#0f1b35;overflow-y:auto;padding:22px 16px 24px;display:flex;flex-direction:column;gap:22px\">\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:14px;font-weight:700;letter-spacing:1.4px;color:#94a3b8;padding:0 17px 6px\">{{ g.label }}<\u002Fspan>\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ it.go }}\" style=\"display:flex;align-items:center;gap:16px;border:0;cursor:pointer;font:inherit;font-size:19px;text-align:left;padding:13px 17px;border-radius:10px;background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}\">\n              <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ it.d }}\"><\u002Fpath><\u002Fsvg>\n              <span>{{ it.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <main style=\"flex:1;overflow-y:auto;padding:40px 38px 60px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:34px\">\n        <h1 style=\"margin:0;font-size:36px;font-weight:600\">{{ title }}<\u002Fh1>\n        <p style=\"margin:0;font-size:21px;color:#475569\">{{ subtitle }}<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:28px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:15px;font-weight:700;letter-spacing:1.2px;color:#475569\">EMPRESA ACTIVA<\u002Fspan>\n              <span style=\"font-size:25px;font-weight:700\">Constructora del Sur SA<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:15px;font-weight:700;letter-spacing:1.2px;color:#475569\">USUARIO ACTIVO<\u002Fspan>\n              <span style=\"font-size:25px;font-weight:700\">Sergio Algorry<\u002Fspan>\n              <span style=\"font-size:17px;color:#475569\">Administrador<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:15px;font-weight:700;letter-spacing:1.2px;color:#475569\">DEPOSITOS A CARGO<\u002Fspan>\n              <span style=\"font-size:25px;font-weight:700\">{{ depositosAccesoCount }} depositos<\u002Fspan>\n              <span style=\"font-size:17px;color:#475569\">{{ depositosAccesoList }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-size:15px;font-weight:700;letter-spacing:1.2px;color:#475569\">PERFIL SIMULADO<\u002Fspan>\n              <span style=\"font-size:25px;font-weight:700\">{{ roleLabel }}<\u002Fspan>\n              <span style=\"font-size:17px;color:#475569\">Se cambia desde el encabezado<\u002Fspan idad:'bolsas' }\n];\nconst FECHA_HOY_ISO = '2026-09-23';\nconst FECHA_HOY_DISPLAY = '23/09/2026';\nconst NECESIDADES_DATA = [\n  { producto:'Hierro nervurado del 8', cantidad:60, unidad:'barras', fecha:'2026-10-05', origen:'Obra Barrio Jardin', destino:'Deposito central', estado:'Pendiente' },\n  { producto:'Ladrillo hueco 12x18x33', cantidad:500, unidad:'unidades', fecha:'2026-09-28', origen:'Deposito central', destino:'Obra Barrio Jardin', estado:'Pendiente' },\n  { producto:'Cemento Portland 50 kg', cantidad:100, unidad:'bolsas', fecha:'2026-09-10', origen:'Obra Barrio Jardin', destino:'Obra Torre Alta', estado:'En nota N.º 1' },\n  { producto:'Arena fina', cantidad:15, unidad:'m3', fecha:'2026-09-18', origen:'Deposito central', destino:'Obra Torre Alta', estado:'En nota N.º 2' },\n  { producto:'Membrana asfaltica 4 mm', cantidad:20, unidad:'rollos', fecha:'2026-09-20', origen:'Obra Barrio Jardin', destino:'Deposito central', estado:'En nota N.º 5' }\n];\nconst NECESIDAD_LABEL = i => `Necesidad #${i+1} (${NECESIDADES_DATA[i].origen} → ${NECESIDADES_DATA[i].destino})`;\nconst necesidadEstadoTone = e => e==='Pendiente' ? 'amber' : e.startsWith('En nota') ? 'blue' : 'green';\nconst REMITOS_DATA = [\n  { id:'R-0012', tipo:'Entrada', origen:'—', destino:'Deposito central', producto:'Cemento Portland 50 kg', cantidad:320, unidad:'bolsas', fechaEmision:'2026-09-18', estado:'Recibido', fechaRecepcion:'2026-09-18' },\n  { id:'R-0013', tipo:'Entrada', origen:'—', destino:'Obra Barrio Jardin', producto:'Ladrillo hueco 12x18x33', cantidad:1200, unidad:'unidades', fechaEmision:'2026-09-20', estado:'Recibido', fechaRecepcion:'2026-09-20' },\n  { id:'R-0014', tipo:'Salida', origen:'Deposito central', destino:'—', producto:'Pintura latex interior 20 L', cantidad:3, unidad:'baldes', fechaEmision:'2026-09-21', estado:'Emitido', fechaRecepcion:'' },\n  { id:'R-0015', tipo:'Transferencia', origen:'Obra Barrio Jardin', destino:'Deposito central', producto:'Membrana asfaltica 4 mm', cantidad:5, unidad:'rollos', fechaEmision:'2026-09-22', estado:'Recibido', fechaRecepcion:'2026-09-24' },\n  { id:'R-0016', tipo:'Transferencia', origen:'Deposito central', destino:'Obra Barrio Jardin', producto:'Cal hidratada 25 kg', cantidad:40, unidad:'bolsas', fechaEmision:'2026-09-26', estado:'Emitido', fechaRecepcion:'' }\n];\nconst COTIZACIONES_DATA = [\n  { id:1, notaId:1, empresa:'Corralon El Puente', plazo:'5 dias habiles', fechaEnvio:'08/09/2026', estado:'Aceptada',\n    items:[{p:'Hierro nervurado del 8', q:60, pu:9800},{p:'Membrana asfaltica 4 mm', q:20, pu:15400}] },\n  { id:2, notaId:2, empresa:'Corralon El Puente', plazo:'3 dias habiles', fechaEnvio:'24/09/2026', estado:'Enviada',\n    items:[{p:'Arena fina', q:15, pu:12000}] },\n  { id:3, notaId:2, empresa:'Sanitarios Rivera', plazo:'7 dias habiles', fechaEnvio:'25/09/2026', estado:'Enviada',\n    items:[{p:'Arena fina', q:15, pu:11500}] }\n];\nconst COT_ESTADOS = ['Enviada','Aceptada','Rechazada'];\nconst cotEstadoTone = e => e==='Enviada' ? TONES.blue : e==='Aceptada' ? TONES.green : TONES.red;\nconst TABLES = {\n  empresas:{ title:'Empresas', sub:'Empresas registradas en la plataforma.', unit:'empresas', cols:['NOMBRE','CUIT','TIPO','ESTADO'], rows:[\n    ['Constructora del Sur SA','30-71234567-8',b('Compradora','blue'),b('Activa','green')],\n    ['Grupo Edilicio Norte SA','30-70987654-3',b('Compradora','blue'),b('Activa','green')],\n    ['Constructora Andina SRL','30-71555222-1',b('Compradora','blue'),b('Activa','green')],\n    ['Corralon El Puente','30-68111333-9',b('Proveedora','amber'),b('Activa','green')],\n    ['Sanitarios Rivera','20-28444555-6',b('Proveedora','amber'),b('Pendiente','gray')]]},\n  usuarios:{ title:'Usuarios', sub:'Usuarios con acceso a Constructora del Sur SA.', unit:'usuarios', cols:['NOMBRE','EMAIL','ROL','ESTADO','DEPOSITOS'], rows:[\n    ['Sergio Algorry','salgorry@delsur.com',b('Administrador','blue'),b('Activo','green'),'Deposito central, Obra Barrio Jardin'],\n    ['Lucia Fernandez','lfernandez@delsur.com',b('Compras','blue'),b('Activo','green'),'Obra Barrio Jardin'],\n    ['Martin Gomez','mgomez@delsur.com',b('Deposito','gray'),b('Activo','green'),'Deposito central, Obra Torre Alta'],\n    ['Paula Rios','prios@delsur.com',b('Compras','blue'),b('Inactivo','red'),'Obra Torre Alta']]},\n  depositos:{ title:'Depositos', sub:'Depositos y obras de la empresa.', unit:'depositos', cols:['NOMBRE','DIRECCION','RESPONSABLE'], rows:[\n    ['Deposito central','Av. Colon 1450, Cordoba','Martin Gomez'],\n    ['Obra Barrio Jardin','Calle 12 n.º 320','Lucia Fernandez'],\n    ['Obra Torre Alta','Bv. San Juan 880','Martin Gomez']]},\n  productos:{ title:'Productos', sub:'Catalogo de productos de la empresa.', unit:'productos', cols:['NOMBRE','DESCRIPCION','CATEGORIA'], rows:[\n    ['Cemento Portland 50 kg','Bolsa de 50 kg, uso general',b('Aridos y cementos','blue')],\n    ['Hierro nervurado del 8','Barra de 12 m',b('Hierros','blue')],\n    ['Ladrillo hueco 12x18x33','Ceramico portante',b('Mamposteria','blue')],\n    ['Arena fina','A granel, por metro cubico',b('Aridos y cementos','blue')],\n    ['Membrana asfaltica 4 mm','Rollo de 10 m con aluminio',b('Impermeabilizantes','blue')],\n    ['Cal hidratada 25 kg','Bolsa de 25 kg',b('Aridos y cementos','blue')],\n    ['Cano PVC 110 mm','Tira de 4 m para desague',b('Sanitarios','blue')],\n    ['Pintura latex interior 20 L','Balde de 20 litros, blanco mate',b('Pinturas','blue')]]},\n  stock:{ title:'Stock', sub:'Existencias por deposito, dentro de tus depositos asignados.', unit:'registros', cols:['PRODUCTO','DEPOSITO','CANTIDAD'],\n    rows: STOCK_DATA.map(s => [s.producto, s.deposito, `${s.cantidad} ${s.unidad}`]) },\n  necesidades:{ title:'Necesidades', sub:'Faltantes detectados entre depositos de la empresa.', unit:'necesidades',\n    cols:['ORIGEN','DESTINO','PRODUCTO','CANTIDAD REQUERIDA','FECHA REQUERIDA','ESTADO'],\n    rows: NECESIDADES_DATA.map(n => [n.origen, n.destino, n.producto, `${n.cantidad} ${n.unidad}`, fmtDate(n.fecha), b(n.estado, necesidadEstadoTone(n.estado))]) },\n  remitos:{ title:'Remitos', sub:'Remitos de entrada (recepcion de proveedor externo), salida y transferencia. Una transferencia se emite descontando el origen; la recepcion es total: si llega mercaderia rota, el deposito receptor abre una necesidad al deposito que la envio.', unit:'remitos',\n    cols:['N.º','TIPO','ORIGEN','DESTINO','PRODUCTO','CANTIDAD','FECHA EMISION','ESTADO','FECHA RECEPCION'],\n    rows: REMITOS_DATA.map(r => [r.id, r.tipo, r.origen, r.destino, r.producto, `${r.cantidad} ${r.unidad}`, fmtDate(r.fechaEmision), b(r.estado, r.estado==='Emitido' ? 'amber' : 'green'), fmtDate(r.fechaRecepcion)]) },\n  notas:{ title:'Notas de pedido', sub:'Notas de pedido de Constructora del Sur SA, generadas a partir de una necesidad.', unit:'notas',\n    cols:['N.º','NECESIDAD','DESCRIPCION','ITEMS','VENCE','ESTADO'], rows:[\n    ['1', NECESIDAD_LABEL(2), 'Materiales obra Barrio Jardin','4','10/09/2026',b('Cerrada','gray')],\n    ['2', NECESIDAD_LABEL(3), 'Reposicion de aridos','2','30/09/2026',b('Publicada','blue')],\n    ['5', NECESIDAD_LABEL(4), 'Hierros y membranas','3','—',b('Borrador','amber')]]}\n};\nconst PRODS = TABLES.productos.rows.map(r => r[0]);\nconst DEPS = TABLES.depositos.rows.map(r => r[0]);\nconst NECESIDAD_OPTS = NECESIDADES_DATA.map((n,i) => NECESIDAD_LABEL(i));\nfunction fmtDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }\nconst num = s => parseFloat(String(s).replace(/\\./g,'').replace(',','.')) || 0;\nconst F = (key, label, opts, type) => ({ key, label, opts, type: opts ? 'select' : (type || 'text') });\nconst FORMS = {\n  empresas:{ btn:'Nueva empresa', fields:[F('n','Nombre'),F('c','CUIT'),F('t','Tipo',['Compradora','Proveedora'])],\n    row:v => [v.n,v.c,b(v.t,v.t==='Compradora'?'blue':'amber'),b('Pendiente','gray')] },\n  usuarios:{ btn:'Nuevo usuario', fields:[F('n','Nombre'),F('e','Email',null,'email'),F('r','Rol',['Administrador','Compras','Deposito']),{ key:'dep', label:'Depositos asignados', opts:DEPS, type:'multi' }],\n    row:v => [v.n,v.e,b(v.r,v.r==='Deposito'?'gray':'blue'),b('Activo','green'), (v.dep||[]).join(', ')] },\n  depositos:{ btn:'Nuevo deposito', fields:[F('n','Nombre'),F('d','Direccion'),F('r','Responsable',['Sergio Algorry','Lucia Fernandez','Martin Gomez'])],\n    row:v => [v.n,v.d,v.r] },\n  productos:{ btn:'Nuevo producto', fields:[F('n','Nombre'),F('d','Descripcion'),F('c','Categoria',['Aridos y cementos','Hierros','Mamposteria','Impermeabilizantes','Sanitarios','Pinturas'])],\n    row:v => [v.n,v.d,b(v.c,'blue')] },\n  stock:{ btn:'Registrar stock', fields:[F('p','Producto',PRODS),F('d','Deposito',USER_DEPS),F('q','Cantidad',null,'number'),F('u','Unidad',['unidad','bolsa','barra','m3','rollo','balde'])],\n    row:v => [v.p, v.d, `${v.q} ${v.u}`] },\n  necesidades:{ btn:'Nueva necesidad', fields:[F('p','Producto',PRODS),F('q','Cantidad requerida',null,'number'),F('u','Unidad',['unidad','bolsa','barra','m3','rollo','balde']),F('f','Fecha requerida',null,'date'),F('origen','Deposito origen (solicitante)',USER_DEPS),F('destino','Deposito destino',DEPS)],\n    row:(v,c) => [v.origen, v.destino, v.p, `${v.q} ${v.u}`, fmtDate(v.f), b('Pendiente','amber')] },\n  remitos:{ btn:'Nuevo remito', fields:[F('t','Tipo',['Entrada','Salida','Transferencia']),F('p','Producto',PRODS),F('q','Cantidad',null,'number'),F('u','Unidad',['unidad','bolsa','barra','m3','rollo','balde']),F('o','Deposito origen',['—',...DEPS]),F('d','Deposito destino',['—',...DEPS])],\n    row:(v,c) => { const estado = v.t==='Entrada' ? 'Recibido' : 'Emitido';\n      return ['R-00'+(REMITOS_DATA.length+c+12), v.t, v.o, v.d, v.p, `${v.q} ${v.u}`, FECHA_HOY_DISPLAY, b(estado, estado==='Emitido'?'amber':'green'), estado==='Recibido' ? FECHA_HOY_DISPLAY : '—']; } },\n  notas:{ btn:'Nueva nota de pedido', fields:[F('nec','Necesidad',NECESIDAD_OPTS),F('d','Descripcion'),F('p','Producto',PRODS),F('q','Cantidad',null,'number'),F('f','Vence',null,'date')],\n    row:(v,c) => [String(6+c), v.nec, `${v.d} (${v.p} × ${v.q})`, '1', fmtDate(v.f), b('Borrador','amber')] }\n};\nconst NOTES = [\n  { id:4, company:'Grupo Edilicio Norte SA', days:2, due:'25/09/2026', note:'Entrega parcial aceptada.', items:[{p:'Cal hidratada 25 kg',q:'80 bolsa',n:80},{p:'Cano PVC 110 mm',q:'150 unidad',n:150}] },\n  { id:3, company:'Constructora Andina SRL', days:8, due:'01/10/2026', note:'Requiere flete incluido.', items:[{p:'Arena fina',q:'25 m3',n:25},{p:'Membrana asfaltica 4 mm',q:'40 rollo',n:40}] },\n  { id:7, company:'Constructora Andina SRL', days:20, due:'13/10/2026', note:'Compra programada para el proximo mes.', items:[{p:'Cemento Portland 50 kg',q:'200 bolsa',n:200}] }\n];\n\nclass Component extends DCLogic {\n  state = { section:'dashboard', role:'comprador', query:'', quoted:{}, modalId:null, revisarId:null, prices:{}, extra:{}, formOpen:false, form:{}, formErr:false, formErrMsg:'', toast:'' };\n  go = (s) => this.setState({ section:s, query:'', formOpen:false });\n  approve = (id) => {\n    if (!confirm(`¿Aprobar la nota de pedido N.º ${id}?`)) return;\n    this.setState(s => ({ approved:{ ...(s.approved||{}), [id]:true }, toast:`Nota N.º ${id} aprobada` }));\n    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast:'' }), 2200); };\n  openForm = () => { const f = FORMS[this.state.section], form = {};\n    f.fields.forEach(x => form[x.key] = x.type==='multi' ? [] : (x.opts ? x.opts[0] : ''));\n    if (this.state.section === 'necesidades') {\n      form.destino = 'Deposito central';\n      form.origen = USER_DEPS.find(d => d !== form.destino) || USER_DEPS[0];\n    }\n    this.setState({ formOpen:true, form, formErr:false, formErrMsg:'' }); };\n  openRevisar = (necId) => this.setState({ revisarId: necId });\n  closeRevisar = () => this.setState({ revisarId: null });\n  crearNotaDesdeNecesidad = (necId, raw) => {\n    const notas = this.state.extra.notas || [];\n    const nroNota = 6 + notas.length;\n    const necLabel = `Necesidad #${necId+1} (${raw.origen} → ${raw.destino})`;\n    const row = [String(nroNota), necLabel, `Reposicion de ${raw.producto}`, '1', '—', b('Borrador','amber')];\n    this.setState(s => ({\n      extra: { ...s.extra, notas:[...notas,row], necesidadesEstado:{ ...(s.extra.necesidadesEstado||{}), [necId]: `En nota N.º ${nroNota}` } },\n      revisarId:null, toast:`Nota de pedido N.º ${nroNota} creada a mano desde la Necesidad #${necId+1}` }));\n    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast:'' }), 2600); };\n  registrarRemitoTransferencia = (necId, raw) => {\n    // La necesidad guarda origen = deposito solicitante, destino = deposito con stock disponible.\n    // El remito fisico va en sentido inverso: origen fisico = raw.destino, destino fisico = raw.origen.\n    const remitos = this.state.extra.remitos || [];\n    const remitosRaw = this.state.extra.remitosRaw || [];\n    const nroRemito = 'R-00' + (REMITOS_DATA.length + remitos.length + 12);\n    const row = [nroRemito, 'Transferencia', raw.destino, raw.origen, raw.producto, `${raw.cantidad} ${raw.unidad}`, FECHA_HOY_DISPLAY, b('Emitido','amber'), '—'];\n    const orgStock = STOCK_DATA.find(s => s.producto===raw.producto && s.deposito===raw.destino);\n    if (orgStock) orgStock.cantidad = Math.max(0, orgStock.cantidad - raw.cantidad);\n    const rawRow = { id:nroRemito, tipo:'Transferencia', origen:raw.destino, destino:raw.origen, producto:raw.producto, cantidad:raw.cantidad, unidad:raw.unidad, fechaEmision:FECHA_HOY_ISO, estado:'Emitido', fechaRecepcion:'' };\n    this.setState(s => ({\n      extra: { ...s.extra, remitos:[...remitos,row], remitosRaw:[...remitosRaw,rawRow], necesidadesEstado:{ ...(s.extra.necesidadesEstado||{}), [necId]:'Cubierta' } },\n      revisarId:null, toast:`Remito de transferencia ${nroRemito} emitido, pendiente de recepcion, para la Necesidad #${necId+1}` }));\n    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast:'' }), 2600); };\n  registrarRecepcion = (remId) => {\n    const remRawAll = [...REMITOS_DATA, ...(this.state.extra.remitosRaw||[])];\n    const raw = remRawAll[remId];\n    if (!raw) return;\n    const fecha = prompt('Fecha de recepcion (AAAA-MM-DD):', FECHA_HOY_ISO);\n    if (!fecha) return;\n    const destStock = STOCK_DATA.find(s => s.producto===raw.producto && s.deposito===raw.destino);\n    if (destStock) destStock.cantidad += raw.cantidad; else STOCK_DATA.push({ producto:raw.producto, deposito:raw.destino, cantidad:raw.cantidad, unidad:raw.unidad });\n    this.setState(s => ({\n      extra: { ...s.extra, remitosEstado: { ...(s.extra.remitosEstado||{}), [remId]: { estado:'Recibido', fechaRecepcion:fecha } } },\n      toast:`Recepcion registrada para el remito ${raw.id}. Recepcion total: si llega mercaderia rota, abri una necesidad al deposito que la envio.` }));\n    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast:'' }), 3200); };\n  saveForm = (e) => { e && e.preventDefault(); const { section, form, extra } = this.state, f = FORMS[section];\n    if (f.fields.some(x => !String(form[x.key]).trim())) return this.setState({ formErr:true, formErrMsg:'Completa todos los campos.' });\n    if (section === 'necesidades' && form.origen === form.destino) return this.setState({ formErr:true, formErrMsg:'El deposito origen y el destino deben ser distintos.' });\n    const list = extra[section] || [];\n    const newExtra = { ...extra, [section]: [...list, f.row(form, list.length)] };\n    if (section === 'necesidades') {\n      const rawList = extra.necesidadesRaw || [];\n      newExtra.necesidadesRaw = [...rawList, { producto: form.p, cantidad: +form.q, unidad: form.u, fecha: form.f, origen: form.origen, destino: form.destino, estado: 'Pendiente' }];\n    }\n    if (section === 'remitos') {\n      const rawList = extra.remitosRaw || [];\n      const cantidad = +form.q, estado = form.t==='Entrada' ? 'Recibido' : 'Emitido';\n      if (form.t === 'Entrada') {\n        const destStock = STOCK_DATA.find(s => s.producto===form.p && s.deposito===form.d);\n        if (destStock) destStock.cantidad += cantidad; else STOCK_DATA.push({ producto:form.p, deposito:form.d, cantidad, unidad:form.u });\n      } else {\n        const orgStock = STOCK_DATA.find(s => s.producto===form.p && s.deposito===form.o);\n        if (orgStock) orgStock.cantidad = Math.max(0, orgStock.cantidad - cantidad); else STOCK_DATA.push({ producto:form.p, deposito:form.o, cantidad:0, unidad:form.u });\n      }\n      newExtra.remitosRaw = [...rawList, { id:'R-00'+(REMITOS_DATA.length+rawList.length+12), tipo:form.t, origen:form.o, destino:form.d, producto:form.p, cantidad, unidad:form.u, fechaEmision:FECHA_HOY_ISO, estado, fechaRecepcion: estado==='Recibido' ? FECHA_HOY_ISO : '' }];\n    }\n    this.setState({ extra: newExtra, formOpen:false, toast:'Guardado correctamente' });\n    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast:'' }), 2200); };\n  renderVals() {\n    const { section, role, query, quoted, modalId, revisarId, prices, extra } = this.state;\n    const prov = role === 'proveedor';\n    const pill = (on) => on ? ['#fff','#2563eb','0 1px 3px rgba(15,23,42,.12)'] : ['transparent','#475569','none'];\n    const [cb, cc, cs] = pill(!prov), [pb, pc, ps] = pill(prov);\n    const navGroups = NAV.map(g => ({ label:g.label, items:g.items.map(([k,l,d]) => ({ label:l, d, go:() => this.go(k),\n      bg: k===section ? '#2563eb' : 'transparent', color: k===section ? '#fff' : '#e2e8f0', weight: k===section ? 700 : 400 })) }));\n    const v = { navGroups, setComprador:() => this.setState({role:'comprador'}), setProveedor:() => this.setState({role:'proveedor'}),\n      compradorBg:cb, compradorColor:cc, compradorShadow:cs, proveedorBg:pb, proveedorColor:pc, proveedorShadow:ps,\n      roleLabel: prov ? 'Proveedor' : 'Comprador',\n      infoTitle: prov ? 'Vista de proveedor' : 'Vista de compra',\n      infoText             return { form:{...s.form,[x.key]:next}, formErr:false }; }) })) };\n          }\n          return { ...x, isSelect:!!x.opts, isInput:!x.opts, isMulti:false, value:form[x.key] ?? '',\n            onChange: e => { const val = e.target.value; this.setState(s => ({ form:{...s.form,[x.key]:val}, formErr:false })); } };\n        }) });\n      const isNotas = section==='notas', isNecesidades = section==='necesidades', isRemitos = section==='remitos';\n      const approved = this.state.approved || {};\n      const necRawAll = isNecesidades ? [...NECESIDADES_DATA, ...(extra.necesidadesRaw||[])] : null;\n      const necEstadoMap = extra.necesidadesEstado || {};\n      const remRawAll = isRemitos ? [...REMITOS_DATA, ...(extra.remitosRaw||[])] : null;\n      const remEstadoMap = extra.remitosEstado || {};\n      const rows = [...t.rows, ...(extra[section]||[])].filter(r => !q || r.some(c => (typeof c==='string'?c:c.t).toLowerCase().includes(q)));\n      Object.assign(v, { title:t.title, subtitle:t.sub, columns: isNotas ? [...t.cols,'ACCION'] : isNecesidades ? [...t.cols,'REVISAR'] : isRemitos ? [...t.cols,'RECEPCION'] : t.cols, countLabel:`${rows.length} ${t.unit}`, empty:!rows.length,\n        rows: rows.map((r,i) => {\n          let cells = r;\n          if (isNotas) {\n            const id = r[0], st = r[5].t, isAppr = approved[id];\n            cells = [...r.slice(0,5), isAppr ? b('Aprobada','green') : r[5],\n              (!isAppr && st==='Borrador') ? { action:'Aprobar', id } : '—'];\n          }\n          if (isNecesidades) {\n            const raw = necRawAll[i]; const est = necEstadoMap[i] || raw.estado;\n            cells = [...r.slice(0,5), b(est, necesidadEstadoTone(est)), { action:'Revisar', necId:i }];\n          }\n          if (isRemitos) {\n            const raw = remRawAll[i], st = remEstadoMap[i] || {};\n            const estado = st.estado || raw.estado;\n            const fechaRecepcion = fmtDate(st.fechaRecepcion || raw.fechaRecepcion);\n            const puedeRecibir = estado==='Emitido' && raw.tipo==='Transferencia' && USER_DEPS.includes(raw.destino);\n            cells = [...r.slice(0,7), b(estado, estado==='Emitido' ? 'amber' : 'green'), fechaRecepcion,\n              puedeRecibir ? { action:'Registrar recepcion', remId:i } : '—'];\n          }\n          return { bg: i%2 ? '#f8fafc' : '#fff', cells: cells.map((c,j) => {\n            const isAction = !!(c && c.action), isBadge = typeof c !== 'string' && !isAction, tone = isBadge ? TONES[c.tone] : null;\n            return { t: isAction ? c.action : isBadge ? c.t : c, isBadge, isAction, isText:!isBadge && !isAction,\n              onAct: isAction ? (c.necId!==undefined ? () => this.openRevisar(c.necId) : c.remId!==undefined ? () => this.registrarRecepcion(c.remId) : () => this.approve(c.id)) : null,\n              badgeBg: tone&&tone[0], badgeColor: tone&&tone[1], weight: j===0 ? 700 : 400 };\n          }) };\n        }) });\n    }\n    if (section==='marketplace') {\n      Object.assign(v, { title:'Marketplace', subtitle:'Notas de pedido publicadas por otras empresas, disponibles para cotizar.',\n        countLabel:`${NOTES.length} oportunidades`,\n        marketHint: prov ? 'Elegí una nota y cargá tus precios.' : 'Cambiá a Proveedor en el encabezado para cotizar.',\n        notes: NOTES.map(n => { const done = quoted[n.id], dis = !prov || done;\n          const tone = n.days<=3 ? TONES.amber : TONES.green;\n          return { ...n, dueBg:tone[0], dueColor:tone[1], disabled:dis, cursor: dis?'default':'pointer',\n            btnBg: done ? '#16a34a' : (prov ? '#2563eb' : '#cbd5e1'), btnLabel: done ? 'Cotizada ✓' : 'Cotizar',\n            open: () => !dis && this.setState({ modalId:n.id, prices:{} }) }; }) });\n    }\n    if (section==='cotizaciones') {\n      const cotEstadoMap = extra.cotizacionesEstado || {};\n      Object.assign(v, { title:'Cotizaciones', subtitle:'Cotizaciones recibidas de proveedores sobre tus notas de pedido.',\n        countLabe
